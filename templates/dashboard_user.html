<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard - IT Helpdesk</title>
    <meta name="description"
          content="User dashboard for the IT Helpdesk portal to submit and track support requests." />
    <meta name="keywords"
          content="IT helpdesk, user, dashboard, support tickets" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="top-banner">
      <a href='{{ url_for("dashboard_user") }}'>
        <img class="logo"
             src="{{ url_for('static', filename='logo.png') }}"
             alt="IT Helpdesk Logo" />
      </a>
      <div class="banner-title">
        <div class="site-title">IT Helpdesk</div>
        <div class="page-title">User Dashboard</div>
      </div>
    </div>
    <main class="container">
      <h2>Welcome, {{ session['username'] }} (User)</h2>
      <!-- Logout link -->
      <p>
        <a href='{{ url_for("logout") }}'>Logout</a>
      </p>
      <!-- User-specific options -->
      <ul>
        <li>
          <a href='{{ url_for("submit_ticket") }}'>Submit New Ticket</a>
        </li>
        <li>
          <a href='{{ url_for("my_tickets") }}'>View My Tickets</a>
        </li>
        <li>
          <a href='{{ url_for("my_ticket_history") }}'>View My Ticket History</a>
        </li>
      </ul>
    </main>
  </body>
</html>
