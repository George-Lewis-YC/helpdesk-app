<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Ticket History - IT Helpdesk</title>
    </head>
    <body>
        <h3>My Ticket History</h3>
        <p>
            <a href='{{ url_for("dashboard_user") }}'>Back to Dashboard.</a>
        </p>
        <table border="1" cellpadding="8">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Time</th>
            </tr>
            {% for ticket in tickets %}
                <tr>
                    <!-- Ticket ID -->
                    <td>{{ ticket[0] }}</td>
                    <!-- Ticket Title -->
                    <td>{{ ticket[1] }}</td>
                    <!-- Ticket Description -->
                    <td>{{ ticket[2] }}</td>
                    <!-- Ticket Category -->
                    <td>{{ ticket[3] }}</td>
                    <!-- Ticket Priority -->
                    <td>{{ ticket[4] }}</td>
                    <!-- Ticket Status -->
                    <td>{{ ticket[5] }}</td>
                    <!-- Ticket Time -->
                    <td>{{ ticket[6] }}</td>
                </tr>
            {% endfor %}
        </table>
    </body>
</html>
