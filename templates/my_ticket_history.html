<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Ticket History - IT Helpdesk</title>
        <meta name="description"
              content="View your ticket history in the IT Helpdesk portal." />
        <meta name="keywords"
              content="IT helpdesk, user, ticket history, support tickets" />
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="top-banner">
            <a href='{{ url_for("dashboard_user") }}'>
                <img class="logo"
                     src="{{ url_for('static', filename='logo.png') }}"
                     alt="IT Helpdesk Logo" />
            </a>
        </a>
        <div class="banner-title">
            <div class="site-title">IT Helpdesk</div>
            <div class="page-title">User Dashboard - My Ticket History</div>
        </div>
    </div>
    <p>
        <a href='{{ url_for("dashboard_user") }}'>Back to Dashboard.</a>
    </p>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Time</th>
        </tr>
        {% for ticket in tickets %}
            <tr>
                <!-- Ticket ID -->
                <td>{{ ticket[0] }}</td>
                <!-- Ticket Title -->
                <td>{{ ticket[1] }}</td>
                <!-- Ticket Description -->
                <td>{{ ticket[2] }}</td>
                <!-- Ticket Category -->
                <td>{{ ticket[3] }}</td>
                <!-- Ticket Priority -->
                <td>{{ ticket[4] }}</td>
                <!-- Ticket Status -->
                <td>{{ ticket[5] }}</td>
                <!-- Ticket Time -->
                <td>{{ ticket[6] }}</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
