<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - IT Dashboard</title>
    <meta name="description" content="Manage users in the IT Helpdesk portal." />
    <meta name="keywords"
          content="IT helpdesk, manage users, user administration" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="top-banner">
      <a href='{{ url_for("dashboard_admin") }}'>
        <img class="logo"
             src="{{ url_for('static', filename='logo.png') }}"
             alt="IT Helpdesk Logo" />
      </a>
      <div class="banner-title">
        <div class="site-title">IT Helpdesk</div>
        <div class="page-title">Admin Dashboard - Manage Users</div>
      </div>
    </div>
    <p>
      <a href='{{ url_for("dashboard_admin") }}'>Back to Dashboard.</a>
    </p>
    <table border="1" cellpadding="8">
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
      {% for user in users %}
        <tr>
          <!-- User Id -->
          <td>{{ user[0] }}</td>
          <!-- Username -->
          <td>{{ user[1] }}</td>
          <!-- Role -->
          <td>{{ user[2] }}</td>
          <!-- Action / Delete User -->
          <td>
            <form method="POST"
                  action="{{ url_for('delete_user', user_id=user[0]) }}"
                  onsubmit="return confirm('Are you sure you want to delete this user?');">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </table>
  </body>
</html>
