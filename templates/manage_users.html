<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - IT Dashboard</title>
    <meta name="description" content="Manage users in the IT Helpdesk portal." />
    <meta name="keywords"
          content="IT helpdesk, manage users, user administration" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="top-banner">
      <a href='{{ url_for("dashboard_admin") }}'>
        <img class="logo"
             src="{{ url_for('static', filename='logo.png') }}"
             alt="IT Helpdesk Logo" />
      </a>
      <div class="banner-title">
        <div class="site-title">IT Helpdesk</div>
        <div class="page-title">Admin Dashboard - Manage Users</div>
      </div>
    </div>
    <main class="container">
      <p>
        <a href='{{ url_for("dashboard_admin") }}'>Back to Dashboard.</a>
      </p>
      <table border="1" cellpadding="10" cellspacing="0" width="100%">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
        {% for user in users %}
          <tr>
            <!-- User Id -->
            <td>{{ user.id }}</td>
            <!-- Username -->
            <td>{{ user.username }}</td>
            <!-- Role -->
            <td>{{ user.role }}</td>
            <!-- Action / Reset Password -->
            <td>
              <form method="post"
                    action="{{ url_for('reset_password', user_id=user['id']) }}"
                    onsubmit="return confirm('Are you sure you want to reset this users password?');">
                <button type="submit">Reset Password</button>
              </form>
              <!-- Action / Delete User -->
              <form method="post"
                    action="{{ url_for('delete_user', user_id=user['id']) }}"
                    onsubmit="return confirm('Are you sure you want to delete this user?');">
                <button type="submit">Delete</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </table>
    </main>
  </body>
</html>
