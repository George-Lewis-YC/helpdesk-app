<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Staff Dashboard - IT Helpdesk</title>
    <meta name="description"
          content="IT Staff dashboard for the IT Helpdesk portal to manage support tickets." />
    <meta name="keywords"
          content="IT helpdesk, IT staff, dashboard, manage tickets" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="top-banner">
      <img class="logo"
           src="{{ url_for('static', filename='logo.png') }}"
           alt="IT Helpdesk Logo" />
      <div class="banner-title">
        <div class="site-title">IT Helpdesk</div>
        <div class="page-title">IT Staff Dashboard</div>
      </div>
    </div>
    <main class="container">
      <title>IT Staff Dashboard</title>
      <h2>Welcome, {{ session['username'] }} (IT Staff)</h2>
      <!-- Logout link -->
      <p>
        <a href='{{ url_for("logout") }}'>Logout</a>
      </p>
      <!-- User-specific options -->
      <ul>
        <li>
          <a href='{{ url_for("manage_tickets") }}'>Manage Tickets</a>
        </li>
      </ul>
    </main>
  </body>
</html>
